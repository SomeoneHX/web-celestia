# Celestia configuration for the web build.
#
# This is the Configuration block of Celestia's own celestia.cfg (see
# celestia.cfg.in in the Celestia sources), with the paths left as "data/..."
# because the web front end mounts the catalogue files at "/data" in the
# Emscripten file system, which is where a relative path resolves from.
#
# The engine reads this itself: CelestiaCore::initSimulation calls
# ReadCelestiaConfig, so the catalogue lists belong here rather than in the
# JavaScript that used to hand the texts over one by one.

Configuration
{
  StarDatabase                 "data/stars.dat"
  StarNameDatabase             "data/starnames.dat"
  StarCatalogs               [ "data/stars-named.stc"
                               "data/stars-charm2.stc"
                               "data/stars-visualbins.stc"
                               "data/stars-spectbins.stc"
                               "data/whitedwarfs.stc"
                               "data/pulsars.stc"
                               "data/extrasolar.stc"
                               "data/stars-revised.stc"
                               "data/stars-near.stc" ]

  HDCrossIndex                 "data/starxindex-hd.dat"
  SAOCrossIndex                "data/starxindex-sao.dat"

  SolarSystemCatalogs        [ "data/solarsys.ssc"
                               "data/dwarfplanets.ssc"
                               "data/asteroids.ssc"
                               "data/comets.ssc"
                               "data/interstellar.ssc"
                               "data/outersys.ssc"
                               "data/minormoons.ssc"
                               "data/extrasolar.ssc"
                               "data/merc_locs.ssc"
                               "data/venus_locs.ssc"
                               "data/earth_locs.ssc"
                               "data/moon_locs.ssc"
                               "data/mars_locs.ssc"
                               "data/marsmoons_locs.ssc"
                               "data/jupitermoons_locs.ssc"
                               "data/saturnmoons_locs.ssc"
                               "data/uranusmoons_locs.ssc"
                               "data/neptunemoons_locs.ssc"
                               "data/dwarfplanets_locs.ssc"
                               "data/asteroids_locs.ssc"
                               "data/ring_locs.ssc"
                               "data/world-capitals.ssc" ]

  DeepSkyCatalogs            [ "data/galaxies.dsc"
                               "data/globulars.dsc"
                               "data/openclusters.dsc" ]

  # Celestia's startup script, which the core runs from start(): it travels to
  # the Sun, then to the Earth and follows it. It ships with the program rather
  # than the data package, and is mounted at the working directory.
  InitScript                   "start.cel"

  # Run Demo in the File menu, which CelestiaAppWindow::slotRunDemo runs.
  DemoScript                   "demo.cel"

  AsterismsFile                "data/asterisms.dat"
  BoundariesFile               "data/boundaries.dat"

  # Celestia ships DejaVuSans with the program rather than in the data package.
  # These are mounted at /fonts, which is where the engine looks when the value
  # is a bare name.
  Font                         "DejaVuSans.ttf,9"
  TitleFont                    "DejaVuSans-Bold.ttf,15"
  LabelFont                    "DejaVuSans.ttf,9"

  # No extras directories: the web build mounts only the data package.
  ExtrasDirectories          [ ]
}

# Star surface textures by spectral class. Without this block
# applyStarTextures returns early and every star renders untextured, the Sun
# included, so its sunspots never appear. Copied from celestia.cfg.in.
StarTextures
{
	Default "astar.*"

	O "ostar.*"
	B "bstar.*"
	A "astar.*"
	F "fstar.*"
	G "gstar.*"
	K "kstar.*"
	M "mstar.*"

	C "mstar.*"
	R "mstar.*"
	N "mstar.*"
	S "mstar.*"

	WC "ostar.*"
	WN "ostar.*"
	WO "ostar.*"

	L "lstar.*"
	T "browndwarf.*"
	Y "exo-class4night.*"

	WD "whitedwarf.*"
	NeutronStar "ostar.*"
}
